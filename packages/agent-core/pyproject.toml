[project]
name = "line-rca-agent-core"
version = "0.0.0"
description = "Framework-free agent kernel: planning, execution, memory and tools are separate, replaceable parts."
readme = "README.md"
requires-python = ">=3.12"
# Deliberately empty: the kernel must not depend on FastAPI, SQLAlchemy, an HTTP
# client or any LLM SDK. Adapters for those live in apps/api. Enforced by CI.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/line_rca_agent"]
