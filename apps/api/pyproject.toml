[project]
name = "line-rca-api"
version = "0.0.0"
description = "FastAPI adapter layer: HTTP/SSE transport, configuration, persistence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "line-rca-agent-core",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    # [asyncio] brings greenlet, which SQLAlchemy's async layer requires.
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    # SQLite support, so the whole product runs in one container with no database service.
    "aiosqlite==0.22.1",
    "paho-mqtt==2.1.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/line_rca_api"]
