# Alembic configuration for local CLI use.
#
#   uv run alembic upgrade head          (with LRC_DATABASE_URL exported)
#   uv run alembic revision -m "message" --autogenerate
#
# The application itself never reads this file: `python -m line_rca_api.db.bootstrap`
# builds the same configuration in code, so the container needs no ini file.

[alembic]
script_location = src/line_rca_api/migrations
prepend_sys_path = .
version_path_separator = os

# Set to 1 to enable the logging config below; left off so no logging sections are required.
configure_logging = 0
