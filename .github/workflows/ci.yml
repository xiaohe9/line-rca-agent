name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.1"
  NODE_VERSION: "24"

jobs:
  api:
    name: api · lint, format, types, tests
    runs-on: ubuntu-latest
    # The API tests are integration tests: they create the schema by running the real
    # migration and assert against seeded rows. Without this service they would skip, and
    # a skipped integration test is a test that proves nothing.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lrc
          POSTGRES_PASSWORD: lrc
          POSTGRES_DB: lrc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lrc -d lrc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      LRC_TEST_DATABASE_URL: postgresql+asyncpg://lrc:lrc@localhost:5432/lrc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  kernel-contract:
    # Its own job on purpose: the rule that the kernel never imports a framework is an
    # architectural claim, and a failure here should read as a design break, not a test failure.
    name: contract · kernel stays framework-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Kernel import-direction contract
        run: uv run pytest packages/agent-core/tests/test_contracts.py -v

  evaluation:
    # The regression gate that makes "evaluation-driven" more than a claim: a change that
    # lowers root-cause accuracy or raises false positives fails the build.
    name: eval · root-cause regression against the recorded baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: "Fetch SECOM (not committed: 5 MB of CC BY 4.0 data)"
        run: uv run python scripts/fetch_secom.py
      - name: Evaluate and compare to the baseline
        run: uv run python -m eval.run_eval --check eval/baselines/baseline.json

  web:
    name: web · types, lint, tests, build, budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run budget

  images:
    name: images · both Dockerfiles build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build single-container demo image
        # The deployment artifact, so it gets built on every push like the others.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.demo
          push: false
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo

  secrets:
    name: hygiene · no secrets in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # The official image rather than gitleaks-action: the action requires a licence for
        # some account types, and a hygiene gate that fails for licensing reasons teaches
        # people to ignore it.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose

  compose:
    name: compose · configuration is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
